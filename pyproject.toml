[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptmgr"
version = "0.1.0"
description = "Orchestration service for Python AI/automation scripts: schedule, chain (DAG), supervise, report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ScriptManager Contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "aiofiles>=23.2",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx>=0.27",
]
windows = [
    "pywin32>=306",
]
celery = [
    "celery>=5.3",
    "redis>=5.0",
]

[project.scripts]
scriptmgr = "scriptmgr.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Templates and static files live under src/scriptmgr/api/web/
"scriptmgr.api.web" = ["templates/*.html", "templates/**/*.html", "static/**/*"]

[tool.setuptools.data-files]
# Bundle alembic migrations so they are available after a pip install
"scriptmgr/alembic" = ["alembic/env.py", "alembic/script.py.mako"]
"scriptmgr/alembic/versions" = ["alembic/versions/.gitkeep"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
