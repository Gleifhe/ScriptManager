<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ScriptManager{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    a { color: #60a5fa; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Layout */
    .shell { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: #1e293b; padding: 1.5rem 1rem; flex-shrink: 0; }
    .sidebar h1 { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-bottom: 2rem; letter-spacing: .05em; }
    .sidebar nav a { display: flex; align-items: center; gap: .6rem; padding: .5rem .75rem; border-radius: .4rem;
      color: #94a3b8; font-size: .9rem; margin-bottom: .25rem; transition: background .15s, color .15s; }
    .sidebar nav a:hover, .sidebar nav a.active { background: #334155; color: #f1f5f9; text-decoration: none; }
    .main { flex: 1; padding: 2rem; overflow-y: auto; }
    .page-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem; color: #f8fafc; }

    /* Cards */
    .card { background: #1e293b; border-radius: .6rem; padding: 1.25rem; margin-bottom: 1rem; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card { background: #1e293b; border-radius: .6rem; padding: 1.25rem; text-align: center; }
    .stat-card .num { font-size: 2rem; font-weight: 700; color: #60a5fa; }
    .stat-card .label { font-size: .8rem; color: #94a3b8; margin-top: .25rem; }

    /* Table */
    table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    th { text-align: left; padding: .6rem .75rem; color: #94a3b8; border-bottom: 1px solid #334155; font-weight: 600; }
    td { padding: .6rem .75rem; border-bottom: 1px solid #1e293b; }
    tr:hover td { background: #1e293b; }

    /* Badges */
    .badge { display: inline-block; padding: .15rem .55rem; border-radius: 9999px; font-size: .75rem; font-weight: 600; }
    .badge-success { background: #14532d; color: #86efac; }
    .badge-failed  { background: #450a0a; color: #fca5a5; }
    .badge-running { background: #1e3a5f; color: #93c5fd; }
    .badge-queued  { background: #312e81; color: #c4b5fd; }
    .badge-default { background: #334155; color: #cbd5e1; }

    /* Buttons */
    .btn { display: inline-block; padding: .4rem .9rem; border-radius: .4rem; font-size: .875rem; cursor: pointer;
      border: none; font-weight: 500; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-danger  { background: #ef4444; color: #fff; }
    .btn-sm { padding: .25rem .6rem; font-size: .8rem; }

    /* Alerts */
    .alert { padding: .75rem 1rem; border-radius: .4rem; margin-bottom: 1rem; font-size: .9rem; }
    .alert-info { background: #1e3a5f; color: #93c5fd; border-left: 3px solid #3b82f6; }
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <h1>⚙ ScriptMgr</h1>
    <nav>
      <a href="/" {% if active=='dashboard' %}class="active"{% endif %}>🏠 Dashboard</a>
      <a href="/groups" {% if active=='groups' %}class="active"{% endif %}>📁 Groups</a>
      <a href="/scripts" {% if active=='scripts' %}class="active"{% endif %}>📄 Scripts</a>
      <a href="/runs" {% if active=='runs' %}class="active"{% endif %}>▶ Runs</a>
      <a href="/schedules" {% if active=='schedules' %}class="active"{% endif %}>🕐 Schedules</a>
      <a href="/workflows" {% if active=='workflows' %}class="active"{% endif %}>🔀 Workflows</a>
      <a href="/services" {% if active=='services' %}class="active"{% endif %}>🔁 Always-On</a>
      <a href="/reports" {% if active=='reports' %}class="active"{% endif %}>📊 Reports</a>
      <a href="/help" {% if active=='help' %}class="active"{% endif %}>📖 Help / Docs</a>
      <a href="/api/docs" target="_blank">📡 API Docs</a>
    </nav>
  </aside>
  <main class="main">
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
