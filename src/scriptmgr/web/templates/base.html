<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ScriptManager{% block title %}{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f7fa; color: #1a1a2e; }
    nav { background: #1a1a2e; color: #fff; padding: .75rem 1.5rem; display: flex; align-items: center; gap: 1.5rem; }
    nav a { color: #a8d8ea; text-decoration: none; font-size: .9rem; }
    nav a:hover { color: #fff; }
    nav .brand { font-weight: 700; font-size: 1.1rem; color: #fff; }
    main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    h1, h2, h3 { margin-bottom: .75rem; }
    h1 { font-size: 1.6rem; }
    h2 { font-size: 1.2rem; color: #333; border-bottom: 2px solid #e2e8f0; padding-bottom: .4rem; margin-top: 1.5rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    th { background: #f0f4f8; text-align: left; padding: .6rem 1rem; font-size: .8rem; text-transform: uppercase; color: #666; }
    td { padding: .6rem 1rem; border-top: 1px solid #f0f4f8; font-size: .88rem; vertical-align: middle; }
    tr:hover td { background: #f7fafc; }
    .badge { display: inline-block; padding: .2em .6em; border-radius: 4px; font-size: .75rem; font-weight: 600; text-transform: uppercase; }
    .badge-success  { background: #d4edda; color: #155724; }
    .badge-failed   { background: #f8d7da; color: #721c24; }
    .badge-running  { background: #d1ecf1; color: #0c5460; }
    .badge-queued   { background: #fff3cd; color: #856404; }
    .badge-cancelled{ background: #e2e8f0; color: #555; }
    .badge-timed_out{ background: #ffe5b4; color: #7d4e00; }
    .btn { display: inline-block; padding: .4rem .9rem; border-radius: 5px; font-size: .85rem; cursor: pointer; border: none; }
    .btn-primary { background: #3182ce; color: #fff; }
    .btn-danger  { background: #e53e3e; color: #fff; }
    .btn-sm { padding: .25rem .6rem; font-size: .78rem; }
    a { color: #3182ce; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 1.25rem; margin-bottom: 1.25rem; }
    .log-box { background: #1a1a2e; color: #a8d8ea; font-family: monospace; font-size: .82rem; padding: 1rem; border-radius: 6px; overflow-y: auto; max-height: 60vh; white-space: pre-wrap; word-break: break-all; }
    .log-stderr { color: #fc8181; }
    .log-system  { color: #f6e05e; }
  </style>
</head>
<body>
<nav>
  <span class="brand">⚙ ScriptManager</span>
  <a href="/">Dashboard</a>
  <a href="/api/docs">API Docs</a>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
